name: Deploy site

# The site is generated, so the workflow runs the generator rather than
# trusting whatever HTML happened to be committed, then publishes web/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: web
        run: python3 build_site.py

      - name: Fail if the build left broken links
        working-directory: web
        run: |
          python3 build_site.py | tee /tmp/build.log
          grep -q "0 broken internal links" /tmp/build.log

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
